    <style>
      /* Splash loading screen — inline so it paints before the bundle loads. */
      #loader { position: fixed; inset: 0; z-index: 100; background: #0b0b0c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .6s ease, visibility .6s; }
      #loader.done { opacity: 0; visibility: hidden; }
      #loader img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 5px rgba(47,140,255,.35), 0 14px 40px rgba(0,0,0,.5); animation: loaderPulse 1.6s ease-in-out infinite; }
      @keyframes loaderPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      #loader .l-name { color: #fff; font: 800 26px/1 "Inter", system-ui, sans-serif; letter-spacing: .04em; }
      #loader .l-sub { color: rgba(255,255,255,.6); font: 500 12px/1 "Inter", system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase; }
      #loader .l-bar { width: 150px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
      #loader .l-bar span { display: block; height: 100%; width: 40%; border-radius: 99px; background: #2f8cff; animation: loaderBar 1.1s ease-in-out infinite; }
      @keyframes loaderBar { 0% { transform: translateX(-110%); } 100% { transform: translateX(380%); } }
      #loader .l-bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      #loader .l-bubbles i { position: absolute; bottom: -30px; border-radius: 50%; border: 1.5px solid rgba(127,184,255,.5); background: rgba(47,140,255,.12); animation: loaderRise 3s linear infinite; }
      @keyframes loaderRise { to { transform: translateY(-110vh); opacity: 0; } }
    </style>
  </head>
